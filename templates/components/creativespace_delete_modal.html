<p class="experience-status">
    <button type="button"
            class="button button-danger"
            popovertarget="delete-creativespace-{{ artwork.id }}"
            aria-label="Delete {{ artwork.title }}"
            title="DELETE">
        🗑️ Delete 
    </button>
</p>
<div id="delete-creativespace-{{ artwork.id }}"
     class="creativespace-delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-creativespace-title-{{ artwork.id }}">
    <button type="button"
            class="creativespace-delete-modal__backdrop"
            popovertarget="delete-creativespace-{{ artwork.id }}"
            popovertargetaction="hide"
            aria-label="Close"></button>
    <div class="creativespace-delete-modal__content">
        <button type="button"
                class="creativespace-delete-modal__close"
                popovertarget="delete-creativespace-{{ artwork.id }}"
                popovertargetaction="hide"
                aria-label="Close">×</button>
        <h2 id="delete-creativespace-title-{{ artwork.id }}">Delete Artwork</h2>
        <p>
            Are you sure you want to delete this artwork?
            <strong>{{ artwork.title }}</strong>?
        </p>
        <div class="creativespace-delete-modal__actions">
            <button type="button"
                    class="button button-secondary"
                    popovertarget="delete-creativespace-{{ artwork.id }}"
                    popovertargetaction="hide">Cancel</button>
            <form method="post" action="{% url 'main:delete_creative_space' artwork.id %}">
                {% csrf_token %}
                <button type="submit" class="button button-danger">Confirm</button>
            </form>
        </div>
    </div>
</div>
