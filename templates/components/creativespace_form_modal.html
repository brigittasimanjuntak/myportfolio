<div id="add-creativespace-modal" class="creativespace-delete-modal" popover="auto">
    <button type="button"
            class="creativespace-delete-modal__backdrop"
            popovertarget="add-creativespace-modal"
            popovertargetaction="hide"></button>
    <div class="creativespace-delete-modal__content">
        <button type="button"
                class="creativespace-delete-modal__close"
                popovertarget="add-creativespace-modal"
                popovertargetaction="hide">×</button>

        <h2>Add New Artwork</h2>

        <form id="add-artwork-form" class="creative-space-form">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                        <p class="form-error">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}
            <div class="creativespace-delete-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="add-creativespace-modal"
                        popovertargetaction="hide">Cancel</button>
                <button type="submit" class="button">Add Artwork!</button>
            </div>
        </form>
    </div>
</div>
