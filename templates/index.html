{% extends 'base.html' %}
{% block content %}
    <main>
        <!-- PROFILE -->
        <section class="hero" id="profile">
            <div class="container hero-grid">
                <div class="hero-identity">
                    <p class="hero-kicker">Computer Science &middot; Universitas Indonesia</p>
                    <h1>{{ name }}</h1>
                    <h2>· · ────── ꒰ঌ·✦·໒꒱ ────── · ·</h2>
                    <h2>(She/Her) - ID/EN - Sept 7th</h2>
                </div>
                <div class="hero-photo">
                    <div class="photo-block"></div>
                    <img class="avatar" src="static/media/gitta.jpeg" alt="Photo of {{ name }}">
                </div>
                <div class="hero-details">
                    <p class="bio">{{ bio }}</p>
                    <dl class="meta-list">
                        <div class="meta-row">
                            <dt>NPM</dt>
                            <dd>{{ npm }}</dd>
                        </div>
                        <div class="meta-row">
                            <dt>Program</dt>
                            <dd>{{ study_program }}</dd>
                        </div>
                    </dl>
                    <div class="social-links">
                        <a href="https://github.com/brigittasimanjuntak" target="_blank">
                        <img src="/static/media/github.png" alt="GitHub" class="social-link">
                        </a>
                        <a href="https://instagram.com/brigitta_juntak" target="_blank">
                        <img src="/static/media/insta.png" alt="Instagram" class="social-link">
                        </a>
                        <a href="mailto:brigittaelissa@gmail.com" target="_blank">
                        <img src="/static/media/email.png" alt="Email" class="social-link">
                        </a>
                    </div>
                </div>
            </div>
        </section>

        <div class="audio-wrapper">
                <div class="audio-player">
                    <audio controls loop>
                        <source src="/static/media/galacticost.mp3" type="audio/mpeg">
                        Your browser doesn't support audio.
                    </audio>
                    <h2>· · ────── ꒰ঌ·✦·໒꒱ ────── · ·</h2>
                </div>
    </main>

{% endblock content %}
